services:
  - type: web
    name: rag-document-assistant-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_FALLBACK_MODEL
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_DIMENSIONS
        value: 768
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ragdocs
      - key: CLIENT_ORIGIN
        sync: false
